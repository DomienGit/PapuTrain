# Serwowanie statycznego frontendu PapuTrain (SPA).
# try_files: dla ścieżki, której nie ma w dist (np. /historia), zwróć
# index.html — routing robi React po stronie przeglądarki.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
